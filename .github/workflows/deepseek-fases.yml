name: Fases automáticas (OpenCode + Codex)

# Reemplaza las rutinas de claude.ai (trig_01PP5 / trig_01V1pm6J / trig_0117).
# Corre por cron; cada fase se autodescubre el trabajo y no-opea si no hay nada.
# Repo público -> minutos de Actions gratis.
#
# Dos agentes posibles por sitio (columna sitios.agente_preferido, default
# 'codex' desde el 2026-09-15): OpenCode+DeepSeek, o Codex CLI oficial con
# suscripción ChatGPT Plus/Pro (SETUP.md §2e/§2f). El cron dispara los DOS
# cada hora -- cada uno autodescubre y solo toca lo suyo (filtro
# agente_preferido dentro de cada instructivo); el que no tiene sitios
# asignados no-opea, mismo principio que "cero pendientes no es anomalía".
#
# EXCEPCIÓN VIGENTE (desde 2026-09-21): Codex queda pausado del cron --
# la cuenta ChatGPT agotó su cupo de uso el 2026-09-18 y no se recupera
# sola. Solo corre hoy vía workflow_dispatch manual (backend: ambos o
# codex). Ver el comentario junto a "Instalar Codex CLI" para revertir.

on:
  schedule:
    - cron: "17 * * * *"   # cada hora (best-effort; Actions puede demorar 5-15 min)
  workflow_dispatch:
    inputs:
      fase:
        description: "Correr solo una fase (1, 2 o 3). Vacío = las 3."
        required: false
        default: ""
      modelo:
        description: "Modelo a forzar (ej. opencode-go/glm-5.3, o vacío para el default de Codex). Vacío = el del script."
        required: false
        default: ""
      backend:
        description: "Qué agente(s) correr. 'ambos' es el default real del cron -- cada uno atiende solo los sitios con su agente_preferido."
        required: false
        type: choice
        options: ["ambos", "opencode", "codex"]
        default: "ambos"

concurrency:
  group: fases-deepseek
  cancel-in-progress: false

jobs:
  fase:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        fase: ${{ github.event.inputs.fase != '' && fromJSON(format('[{0}]', github.event.inputs.fase)) || fromJSON('[1,2,3]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar OpenCode
        if: github.event.inputs.backend == '' || github.event.inputs.backend == 'ambos' || github.event.inputs.backend == 'opencode'
        run: npm i -g opencode-ai

      - name: Auth de OpenCode (Zen / "OpenCode Go")
        if: github.event.inputs.backend == '' || github.event.inputs.backend == 'ambos' || github.event.inputs.backend == 'opencode'
        env:
          OPENCODE_AUTH_JSON: ${{ secrets.OPENCODE_AUTH_JSON }}
        run: |
          mkdir -p "$HOME/.local/share/opencode"
          node -e '
            const j = JSON.parse(process.env.OPENCODE_AUTH_JSON);
            for (const [name, p] of Object.entries(j)) {
              if (p && typeof p === "object") {
                for (const k of ["key", "apiKey", "token", "access", "refresh"]) {
                  if (typeof p[k] === "string") {
                    const raw = p[k];
                    p[k] = raw.trim();
                    console.log(`  ${name}.${k}: len ${raw.length} -> ${p[k].length}, tenía whitespace: ${/\s/.test(raw)}`);
                  }
                }
              }
            }
            require("fs").writeFileSync(process.env.HOME + "/.local/share/opencode/auth.json", JSON.stringify(j));
            console.log("auth.json OK; providers:", Object.keys(j).join(", "));
          '

      # Codex CLI oficial, autenticado con la suscripción ChatGPT Plus/Pro
      # (device-auth) -- no una API key. Ver SETUP.md §2e: probado el
      # 2026-09-14 que OpenCode NO puede usar ese token (rechazado por
      # OpenAI para cualquier modelo, es un límite del cliente, no del
      # slug), así que esto corre con el cliente oficial en vez de OpenCode.
      #
      # PAUSADO en el cron desde el 2026-09-21: la cuenta ChatGPT lleva
      # agotado el cupo de uso desde el 2026-09-18 ~21:43 (16 corridas
      # seguidas fallando en los primeros 2s con "You've hit your usage
      # limit"). Se saca el fallback `== ''` (el que dispara en schedule)
      # para que el cron deje de intentarlo solo -- workflow_dispatch con
      # `backend: ambos` o `backend: codex` sigue andando para probar a
      # mano si ya se liberó el cupo. Revertir agregando de nuevo
      # `github.event.inputs.backend == '' ||` a las 4 condiciones de
      # Codex de este archivo cuando se confirme que ya tiene cupo.
      - name: Instalar Codex CLI
        if: github.event.inputs.backend == 'ambos' || github.event.inputs.backend == 'codex'
        run: npm i -g @openai/codex

      - name: Auth de Codex (suscripción ChatGPT Plus/Pro)
        if: github.event.inputs.backend == 'ambos' || github.event.inputs.backend == 'codex'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          mkdir -p "$HOME/.codex"
          node -e '
            const j = JSON.parse(process.env.CODEX_AUTH_JSON);
            if (j.tokens) {
              for (const k of ["id_token", "access_token", "refresh_token"]) {
                if (typeof j.tokens[k] === "string") j.tokens[k] = j.tokens[k].trim();
              }
            }
            require("fs").writeFileSync(process.env.HOME + "/.codex/auth.json", JSON.stringify(j));
            console.log("auth.json OK; auth_mode:", j.auth_mode);
          '

      # --- OpenCode / DeepSeek: solo sitios con agente_preferido='opencode' ---
      - name: Correr Fase ${{ matrix.fase }} (OpenCode)
        if: github.event.inputs.backend == '' || github.event.inputs.backend == 'ambos' || github.event.inputs.backend == 'opencode'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # Vacio salvo que se cargue el secreto. Con el, se puede correr
          # una fase con `modelo: anthropic/claude-opus-5` (o sonnet-5).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENCODE_CONFIG: ${{ github.workspace }}/runner/opencode.json
          OPENCODE_MODEL: ${{ github.event.inputs.modelo }}
          GIT_AUTHOR_NAME: "fases-bot"
          GIT_AUTHOR_EMAIL: "fases-bot@users.noreply.github.com"
          GIT_COMMITTER_NAME: "fases-bot"
          GIT_COMMITTER_EMAIL: "fases-bot@users.noreply.github.com"
        run: |
          git config --global user.name "fases-bot"
          git config --global user.email "fases-bot@users.noreply.github.com"
          node runner/verificar-avance.mjs ${{ matrix.fase }} opencode antes /tmp/avance-opencode.json
          bash runner/run-fase.sh ${{ matrix.fase }}

      # Un job en verde que no movio nada es peor que uno en rojo: pasa por
      # exitoso. Compara el estado de los sitios pendientes de ESTE agente
      # contra el snapshot de antes y falla si no toco ninguno de los suyos.
      - name: Verificar que OpenCode avanzo
        if: always() && (github.event.inputs.backend == '' || github.event.inputs.backend == 'ambos' || github.event.inputs.backend == 'opencode')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node runner/verificar-avance.mjs ${{ matrix.fase }} opencode despues /tmp/avance-opencode.json

      # --- Codex / ChatGPT Plus-Pro: solo sitios con agente_preferido='codex' ---
      # Pausado del cron desde el 2026-09-21 -- ver nota junto a "Instalar
      # Codex CLI" arriba.
      - name: Correr Fase ${{ matrix.fase }} (Codex / ChatGPT Plus-Pro)
        if: github.event.inputs.backend == 'ambos' || github.event.inputs.backend == 'codex'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
          OPENCODE_MODEL: ${{ github.event.inputs.modelo }}
          GIT_AUTHOR_NAME: "fases-bot"
          GIT_AUTHOR_EMAIL: "fases-bot@users.noreply.github.com"
          GIT_COMMITTER_NAME: "fases-bot"
          GIT_COMMITTER_EMAIL: "fases-bot@users.noreply.github.com"
        run: |
          git config --global user.name "fases-bot"
          git config --global user.email "fases-bot@users.noreply.github.com"
          node runner/verificar-avance.mjs ${{ matrix.fase }} codex antes /tmp/avance-codex.json
          bash runner/run-fase-codex.sh ${{ matrix.fase }}

      - name: Verificar que Codex avanzo
        if: always() && (github.event.inputs.backend == 'ambos' || github.event.inputs.backend == 'codex')
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node runner/verificar-avance.mjs ${{ matrix.fase }} codex despues /tmp/avance-codex.json

      # El motivo de mover las fases a DeepSeek fue el costo, así que cada
      # corrida tiene que poder decir cuánto gastó. OpenCode no lo imprime,
      # pero deja las sesiones en disco. Corre siempre (if: always()) porque
      # una corrida que falla igual gastó tokens, y nunca rompe el job.
      # No trackea uso de Codex todavía (formato de sesión distinto) --
      # gap conocido, no bloqueante.
      - name: Uso de tokens
        if: always()
        continue-on-error: true
        run: node runner/uso-tokens.mjs

      # Un sitio ya 'terminada' no vuelve a tocarse solo -- si el instructivo
      # de Fase 3 cambia después, nada lo nota. Solo deja una nota visible en
      # el dashboard; nunca reconstruye solo (Base 6).
      - name: Verificar sitios terminados contra el instructivo vigente
        if: always() && matrix.fase == 3
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node runner/verificar-instructivo-vigente.mjs
